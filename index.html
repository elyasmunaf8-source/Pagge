<script>

/* =====================================================
   SUPABASE EINSTELLUNGEN
   ===================================================== */

const SUPABASE_URL =
  "https://afxlawmbcthmxuyssy.h.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_ap8DdhjQ6hxG3Suy81WHzQ_L7aGdxdt";

const FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/dynamic-processor";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   APP
   ===================================================== */

let currentUser = null;
let selectedTeacher = null;


/* =====================================================
   HILFSFUNKTIONEN
   ===================================================== */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");

}


function getDate() {

  const now = new Date();

  const year = now.getFullYear();
  const month =
    String(now.getMonth() + 1).padStart(2, "0");
  const day =
    String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;

}


function getTime() {

  return new Date().toLocaleTimeString(
    "de-DE",
    {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    }
  );

}


function getMinutes(trip) {

  const start =
    new Date(trip.started_at).getTime();

  const end =
    trip.ended_at
      ? new Date(trip.ended_at).getTime()
      : Date.now();

  return Math.floor(
    (end - start) / 60000
  );

}


function getTripClass(minutes) {

  if (minutes <= 4) return "";
  if (minutes <= 6) return "yellow";

  return "red";
}


/* =====================================================
   AUTH-FUNCTION
   ===================================================== */

async function callAuthFunction(body) {

  const response =
    await fetch(
      FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_PUBLISHABLE_KEY
        },

        body: JSON.stringify(body)
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Die Anmeldung konnte nicht durchgeführt werden."
    );

  }


  return data;
}


/* =====================================================
   LOGIN / REGISTRIERUNG
   ===================================================== */

function showAuth(type) {

  const loginBox =
    document.getElementById("loginBox");

  const registerBox =
    document.getElementById("registerBox");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  document.getElementById(
    "authMessage"
  ).textContent = "";


  if (type === "login") {

    loginBox.classList.remove("hidden");
    registerBox.classList.add("hidden");

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

  } else {

    loginBox.classList.add("hidden");
    registerBox.classList.remove("hidden");

    loginTab.classList.remove("active");
    registerTab.classList.add("active");

  }

}


/* KONTO ERSTELLEN */

async function createAccount() {

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();

  const username =
    document.getElementById(
      "registerUsername"
    ).value.trim().toLowerCase();

  const password =
    document.getElementById(
      "registerPassword"
    ).value;

  const password2 =
    document.getElementById(
      "registerPassword2"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (!name || !username || !password) {

    message.textContent =
      "Bitte alle Felder ausfüllen.";

    return;
  }


  if (username === "admin") {

    message.textContent =
      "Dieser Benutzername ist reserviert.";

    return;
  }


  if (password.length < 8) {

    message.textContent =
      "Das Kennwort muss mindestens 8 Zeichen haben.";

    return;
  }


  if (password !== password2) {

    message.textContent =
      "Die Kennwörter stimmen nicht überein.";

    return;
  }


  message.textContent =
    "Konto wird erstellt...";


  try {

    await callAuthFunction({

      action: "register",

      name: name,

      username: username,

      password: password

    });


    document.getElementById(
      "registerName"
    ).value = "";

    document.getElementById(
      "registerUsername"
    ).value = "";

    document.getElementById(
      "registerPassword"
    ).value = "";

    document.getElementById(
      "registerPassword2"
    ).value = "";


    showAuth("login");

    document.getElementById(
      "authMessage"
    ).textContent =
      "Konto wurde erstellt. Du kannst dich jetzt anmelden.";

  } catch (error) {

    message.textContent =
      error.message;

  }

}


/* LOGIN */

async function login() {

  const username =
    document.getElementById(
      "loginUsername"
    ).value.trim().toLowerCase();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (!username || !password) {

    message.textContent =
      "Bitte Benutzername und Kennwort eingeben.";

    return;
  }


  message.textContent =
    "Anmeldung läuft...";


  try {

    const data =
      await callAuthFunction({

        action: "login",

        username: username,

        password: password

      });


    if (!data.access_token ||
        !data.refresh_token) {

      throw new Error(
        "Keine gültige Sitzung erhalten."
      );

    }


    const sessionResult =
      await supabaseClient.auth.setSession({

        access_token:
          data.access_token,

        refresh_token:
          data.refresh_token

      });


    if (sessionResult.error) {

      throw sessionResult.error;

    }


    await loadCurrentUser();


    if (!currentUser) {

      throw new Error(
        "Das Benutzerprofil konnte nicht geladen werden."
      );

    }


    openApp();

  } catch (error) {

    console.error(error);

    message.textContent =
      error.message ||
      "Benutzername oder Kennwort ist falsch.";

  }

}


/* AKTUELLEN BENUTZER LADEN */

async function loadCurrentUser() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    currentUser = null;

    return;

  }


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,name,username,role"
      )
      .eq("id", user.id)
      .single();


  if (error) {

    console.error(error);

    currentUser = null;

    return;

  }


  currentUser = {

    id: profile.id,

    name: profile.name,

    username: profile.username,

    role: profile.role

  };

}


/* =====================================================
   APP ÖFFNEN
   ===================================================== */

async function openApp() {

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document.getElementById(
    "userInfo"
  ).textContent =
    currentUser.name +
    " • @" +
    currentUser.username;


  if (currentUser.role === "admin") {

    document
      .getElementById("teacherNav")
      .classList.add("hidden");

    document
      .getElementById("adminNav")
      .classList.remove("hidden");

    showPage("adminPage");

    setDates();

    await renderTeachers();

  } else {

    document
      .getElementById("teacherNav")
      .classList.remove("hidden");

    document
      .getElementById("adminNav")
      .classList.add("hidden");

    document.getElementById(
      "teacherDisplay"
    ).value =
      currentUser.name;

    setDates();

    showPage("toiletPage");

    await render();

  }

}


/* LOGOUT */

async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  selectedTeacher = null;


  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authScreen")
    .classList.remove("hidden");


  document.getElementById(
    "loginUsername"
  ).value = "";

  document.getElementById(
    "loginPassword"
  ).value = "";

  document.getElementById(
    "authMessage"
  ).textContent = "";


  showAuth("login");

}


/* =====================================================
   SEITEN
   ===================================================== */

function showPage(id, button) {

  [
    "toiletPage",
    "overviewPage",
    "adminPage"
  ].forEach(page => {

    document
      .getElementById(page)
      .classList.add("hidden");

  });


  document
    .getElementById(id)
    .classList.remove("hidden");


  if (button) {

    button.parentElement
      .querySelectorAll("button")
      .forEach(
        b => b.classList.remove("active")
      );

    button.classList.add("active");

  }


  if (id === "overviewPage") {

    renderOverview();

  }


  if (id === "adminPage") {

    renderTeachers();

  }

}


/* =====================================================
   DATUM
   ===================================================== */

function setDates() {

  const date = getDate();


  document.getElementById(
    "selectedDate"
  ).value = date;


  document.getElementById(
    "adminDate"
  ).value = date;

}


/* =====================================================
   TOILETTENGANG STARTEN
   ===================================================== */

async function startToilet() {

  if (!currentUser ||
      currentUser.role !== "teacher") {

    return;

  }


  const input =
    document.getElementById(
      "studentName"
    );

  const name =
    input.value.trim();


  if (!name) {

    document.getElementById(
      "message"
    ).textContent =
      "Bitte Vorname und Nachname eingeben.";

    return;

  }


  const button =
    document.querySelector(
      "#toiletPage .primary"
    );


  button.disabled = true;

  button.textContent =
    "Wird gespeichert...";


  try {

    const {
      error
    } =
      await supabaseClient
        .from("toilet_trips")
        .insert({

          user_id:
            currentUser.id,

          student_name:
            name,

          started_at:
            new Date().toISOString(),

          marked:
            false

        });


    if (error) {

      throw error;

    }


    input.value = "";

    document.getElementById(
      "message"
    ).textContent =
      "Toilettengang wurde genehmigt.";


    await render();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "message"
    ).textContent =
      "Fehler beim Speichern: " +
      error.message;

  } finally {

    button.disabled = false;

    button.textContent =
      "Toilette genehmigen";

  }

}


/* =====================================================
   ZURÜCKGEKOMMEN
   ===================================================== */

async function finishTrip(id) {

  try {

    const {
      error
    } =
      await supabaseClient
        .from("toilet_trips")
        .update({

          ended_at:
            new Date().toISOString()

        })
        .eq("id", id)
        .eq("user_id", currentUser.id);


    if (error) {

      throw error;

    }


    await render();

  } catch (error) {

    console.error(error);

  }

}


/* =====================================================
   MARKIEREN
   ===================================================== */

async function toggleMarked(id) {

  try {

    const {
      data: trip,
      error: readError
    } =
      await supabaseClient
        .from("toilet_trips")
        .select("marked")
        .eq("id", id)
        .eq("user_id", currentUser.id)
        .single();


    if (readError) {

      throw readError;

    }


    const {
      error
    } =
      await supabaseClient
        .from("toilet_trips")
        .update({

          marked:
            !trip.marked

        })
        .eq("id", id)
        .eq("user_id", currentUser.id);


    if (error) {

      throw error;

    }


    await render();

  } catch (error) {

    console.error(error);

  }

}


/* =====================================================
   AKTIVE TRIPS
   ===================================================== */

async function render() {

  if (!currentUser ||
      currentUser.role !== "teacher") {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("toilet_trips")
      .select("*")
      .eq("user_id", currentUser.id)
      .is("ended_at", null)
      .order("started_at", {
        ascending: true
      });


  if (error) {

    console.error(error);

    return;

  }


  const list =
    document.getElementById(
      "activeList"
    );


  if (!data || data.length === 0) {

    list.innerHTML =
      "<p>Momentan ist niemand auf der Toilette.</p>";

    return;

  }


  list.innerHTML =
    data.map(trip => {

      const minutes =
        getMinutes(trip);


      const start =
        new Date(
          trip.started_at
        ).toLocaleTimeString(
          "de-DE",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );


      return `

        <div class="trip
          ${getTripClass(minutes)}
          ${trip.marked ? "marked" : ""}">

          <div class="trip-top">

            <strong>
              ${escapeHTML(
                trip.student_name
              )}
            </strong>

            <span class="duration">
              ${minutes} Min.
            </span>

          </div>

          <div>
            Seit ${start}
          </div>

          <div class="actions">

            <button
              class="small-btn return-btn"
              onclick="finishTrip('${trip.id}')">
              ✓ Zurückgekommen
            </button>

            <button
              class="small-btn mark-btn"
              onclick="toggleMarked('${trip.id}')">

              ${
                trip.marked
                  ? "✓ Markierung entfernen"
                  : "⚠ Zur Überprüfung markieren"
              }

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   VORFALL MELDEN
   ===================================================== */

async function reportIncident() {

  if (!currentUser ||
      currentUser.role !== "teacher") {

    return;

  }


  const input =
    document.getElementById(
      "incidentText"
    );

  const text =
    input.value.trim();


  if (!text) {

    document.getElementById(
      "incidentMessage"
    ).textContent =
      "Bitte eine Beschreibung eingeben.";

    return;

  }


  try {

    const {
      error
    } =
      await supabaseClient
        .from("incidents")
        .insert({

          user_id:
            currentUser.id,

          description:
            text,

          incident_time:
            new Date().toISOString()

        });


    if (error) {

      throw error;

    }


    input.value = "";

    document.getElementById(
      "incidentMessage"
    ).textContent =
      "Vorfall wurde gespeichert.";


  } catch (error) {

    console.error(error);

    document.getElementById(
      "incidentMessage"
    ).textContent =
      "Fehler beim Speichern: " +
      error.message;

  }

}


/* =====================================================
   LEHRER-ÜBERSICHT
   ===================================================== */

async function renderOverview() {

  if (!currentUser ||
      currentUser.role !== "teacher") {

    return;

  }


  const date =
    document.getElementById(
      "selectedDate"
    ).value;


  const start =
    `${date}T00:00:00`;

  const end =
    `${date}T23:59:59.999`;


  const {
    data: tripsData,
    error: tripsError
  } =
    await supabaseClient
      .from("toilet_trips")
      .select("*")
      .eq("user_id", currentUser.id)
      .gte("started_at", start)
      .lte("started_at", end)
      .order("started_at", {
        ascending: false
      });


  if (tripsError) {

    console.error(tripsError);

    return;

  }


  const {
    data: incidentsData,
    error: incidentsError
  } =
    await supabaseClient
      .from("incidents")
      .select("*")
      .eq("user_id", currentUser.id)
      .gte("incident_time", start)
      .lte("incident_time", end)
      .order("incident_time", {
        ascending: false
      });


  if (incidentsError) {

    console.error(incidentsError);

    return;

  }


  const ownTrips =
    tripsData || [];

  const ownIncidents =
    incidentsData || [];


  document.getElementById(
    "statTrips"
  ).textContent =
    ownTrips.length;


  document.getElementById(
    "statStudents"
  ).textContent =
    new Set(
      ownTrips.map(
        t => t.student_name
      )
    ).size;


  document.getElementById(
    "statMarked"
  ).textContent =
    ownTrips.filter(
      t => t.marked
    ).length;


  const log =
    document.getElementById(
      "logList"
    );


  if (!ownTrips.length) {

    log.innerHTML =
      "<p>Keine Einträge für diesen Tag.</p>";

  } else {

    log.innerHTML =
      ownTrips.map(t => {

        const startTime =
          new Date(
            t.started_at
          ).toLocaleTimeString(
            "de-DE",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


        const endTime =
          t.ended_at
            ? new Date(
                t.ended_at
              ).toLocaleTimeString(
                "de-DE",
                {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit"
                }
              )
            : "noch unterwegs";


        return `

          <div class="log-entry">

            <strong>
              ${escapeHTML(
                t.student_name
              )}
            </strong>

            <br>

            ${startTime}
            →
            ${endTime}

            ${
              t.marked
                ? "<br>⚠ Zur Überprüfung markiert"
                : ""
            }

          </div>

        `;

      }).join("");

  }


  const incidentList =
    document.getElementById(
      "incidentList"
    );


  if (!ownIncidents.length) {

    incidentList.innerHTML =
      "<p>Keine Vorfälle für diesen Tag.</p>";

  } else {

    incidentList.innerHTML =
      ownIncidents.map(i => {

        const time =
          new Date(
            i.incident_time
          ).toLocaleTimeString(
            "de-DE",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


        return `

          <div class="incident">

            <strong>
              ${time}
            </strong>

            <br>

            ${escapeHTML(
              i.description
            )}

          </div>

        `;

      }).join("");

  }

}


/* =====================================================
   ADMIN – LEHRER LADEN
   ===================================================== */

async function renderTeachers() {

  if (!currentUser ||
      currentUser.role !== "admin") {

    return;

  }


  const search =
    document
      .getElementById(
        "teacherSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const {
    data: teachers,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,name,username,role"
      )
      .eq("role", "teacher")
      .order("name");


  if (error) {

    console.error(error);

    return;

  }


  const filtered =
    (teachers || []).filter(
      user =>
        user.username
          .toLowerCase()
          .includes(search)
        ||
        user.name
          .toLowerCase()
          .includes(search)
    );


  const list =
    document.getElementById(
      "teacherList"
    );


  if (!filtered.length) {

    list.innerHTML =
      "<p>Kein Lehrer gefunden.</p>";

    return;

  }


  list.innerHTML =
    filtered.map(user => `

      <button
        class="teacher-button
          ${
            selectedTeacher === user.username
              ? "selected"
              : ""
          }"
        onclick="
          selectTeacher(
            '${escapeAttribute(
              user.username
            )}'
          )
        ">

        <span>

          👤 <strong>
            ${escapeHTML(
              user.name
            )}
          </strong>

          <br>

          <small>
            @${escapeHTML(
              user.username
            )}
          </small>

        </span>

        <span>›</span>

      </button>

    `).join("");

}


/* =====================================================
   ADMIN – LEHRER AUSWÄHLEN
   ===================================================== */

async function selectTeacher(username) {

  selectedTeacher =
    username;


  document
    .getElementById(
      "adminTeacherView"
    )
    .classList.remove("hidden");


  const {
    data: user,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,name,username,role"
      )
      .eq("username", username)
      .single();


  if (error) {

    console.error(error);

    return;

  }


  document.getElementById(
    "selectedTeacher"
  ).innerHTML = `

    <p>

      <strong>
        ${escapeHTML(
          user.name
        )}
      </strong>

      · @${escapeHTML(
        user.username
      )}

    </p>

  `;


  await renderTeachers();

  await renderAdminLog();

}

            ? new Date(
                t.ended_at
              ).toLocaleTimeString(
                "de-DE",
                {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit"
                }
              )
            : "noch unterwegs";


        return `

          <div class="log-entry">

            <strong>
              ${escapeHTML(
                t.student_name
              )}
            </strong>

            <br>

            ${startTime}
            →
            ${endTime}

            ${
              t.marked
                ? "<br>⚠ Zur Überprüfung markiert"
                : ""
            }

          </div>

        `;

      }).join("");

  }


  const incidentList =
    document.getElementById(
      "adminIncidents"
    );


  if (!teacherIncidents.length) {

    incidentList.innerHTML =
      "<p>Keine Vorfälle für diesen Tag.</p>";

  } else {

    incidentList.innerHTML =
      teacherIncidents.map(i => {

        const time =
          new Date(
            i.incident_time
          ).toLocaleTimeString(
            "de-DE",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );


        return `

          <div class="incident">

            <strong>
              ${time}
            </strong>

            <br>

            ${escapeHTML(
              i.description
            )}

          </div>

        `;

      }).join("");

  }

}


/* =====================================================
   AUTOMATISCH AKTUALISIEREN
   ===================================================== */

setInterval(() => {

  if (
    currentUser &&
    currentUser.role === "teacher"
  ) {

    render();

  }

}, 1000);


/* =====================================================
   BEIM LADEN VORHANDENE SITZUNG PRÜFEN
   ===================================================== */

(async function init() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    await loadCurrentUser();

    if (currentUser) {

      openApp();

    }

  }

})();

</script>
